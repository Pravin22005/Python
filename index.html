<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Playground</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,sans-serif }
    header { height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid var(--border); background:#010409 }
    h1 { margin:0; font-size:18px } h1 span { color:#ffd43b }
    button { height:36px; border:1px solid var(--border); border-radius:6px; background:#21262d; color:var(--text); padding:0 12px; cursor:pointer }
    button.primary { background:#238636; border-color:#2ea043; font-weight:600 }
    main { display:grid; grid-template-columns:220px 1fr; height:calc(100vh - 58px) }
    aside { border-right:1px solid var(--border); background:var(--panel); overflow:auto }
    aside h2 { margin:0; padding:14px 16px 8px; color:var(--muted); font-size:12px; text-transform:uppercase }
    #files { list-style:none; margin:0; padding:6px }
    #files button { width:100%; height:auto; text-align:left; border:0; background:transparent; padding:8px 10px }
    #files button.active { background:#30363d }
    .work { display:grid; grid-template-rows:minmax(300px,1fr) 220px; min-width:0 }
    .editor-head,.output-head { height:53px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding:8px 12px; background:var(--panel) }
    #filename,#status { color:var(--muted); font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    textarea { width:100%; height:calc(100% - 53px); resize:none; border:0; outline:0; padding:18px; background:#0d1117; color:#e6edf3; font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; tab-size:4 }
    pre { margin:0; height:167px; overflow:auto; padding:14px 18px; white-space:pre-wrap; color:#b6e3ff; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace }
    #saveResult { margin-left:8px }
  </style>
</head>
<body>
  <header>
    <h1><span>&gt;_</span> Python Playground</h1>
    <div>
      <button id="download">Download</button>
      <button id="save">Save as PR</button>
      <button id="run" class="primary">Run Python</button>
    </div>
  </header>
  <main>
    <aside><h2>Repository files</h2><ul id="files"></ul></aside>
    <section class="work">
      <div>
        <div class="editor-head"><span id="filename">hello.py</span><span id="status">Loading...</span></div>
        <textarea id="editor" spellcheck="false" aria-label="Python code"></textarea>
      </div>
      <div>
        <div class="output-head"><strong>Output</strong><button id="clear">Clear</button></div>
        <pre id="output"></pre>
      </div>
    </section>
  </main>
  <script>
    const API = localStorage.getItem('python-playground-api') || '';
    const editor = document.querySelector('#editor');
    const output = document.querySelector('#output');
    const status = document.querySelector('#status');
    const filename = document.querySelector('#filename');
    const owner = 'pravin22kumar';
    const repo = 'Python';
    let activeFile = 'hello.py';

    async function loadFiles() {
      const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents`);
      if (!response.ok) throw new Error('Could not load repository files');
      const files = (await response.json()).filter(file => file.type === 'file' && file.name.endsWith('.py'));
      const list = document.querySelector('#files');
      list.innerHTML = '';
      for (const file of files) {
        const li = document.createElement('li');
        const button = document.createElement('button');
        button.textContent = file.name;
        button.dataset.name = file.name;
        button.onclick = () => openFile(file);
        li.appendChild(button);
        list.appendChild(li);
      }
      if (files.length) openFile(files[0]);
    }

    async function openFile(file) {
      document.querySelectorAll('#files button').forEach(button => button.classList.toggle('active', button.dataset.name === file.name));
      activeFile = file.name;
      filename.textContent = file.name;
      const response = await fetch(file.download_url);
      editor.value = response.ok ? await response.text() : '# Unable to load file';
    }

    async function runCode() {
      if (!API) {
        output.textContent = 'Set the API URL: localStorage.setItem("python-playground-api", "https://your-api.example")';
        return;
      }
      output.textContent = '';
      status.textContent = 'Running...';
      try {
        const response = await fetch(API + '/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: editor.value })
        });
        const result = await response.json();
        output.textContent = (result.stdout || '') + (result.stderr || '');
        status.textContent = response.ok ? `Exit code: ${result.exit_code}` : 'Error';
      } catch (error) {
        output.textContent = error.message;
        status.textContent = 'Error';
      }
    }

    async function savePullRequest() {
      if (!API) {
        alert('Set the API URL with localStorage.setItem("python-playground-api", "...")');
        return;
      }
      status.textContent = 'Creating pull request...';
      try {
        const response = await fetch(API + '/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: activeFile, content: editor.value, title: `Update ${activeFile}` })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Could not create pull request');
        status.textContent = 'Pull request created';
        window.open(result.pull_request_url, '_blank', 'noopener');
      } catch (error) {
        status.textContent = 'Save failed';
        alert(error.message);
      }
    }

    document.querySelector('#run').onclick = runCode;
    document.querySelector('#save').onclick = savePullRequest;
    document.querySelector('#clear').onclick = () => output.textContent = '';
    document.querySelector('#download').onclick = () => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([editor.value], { type: 'text/x-python' }));
      link.download = activeFile;
      link.click();
      URL.revokeObjectURL(link.href);
    };
    editor.addEventListener('keydown', event => {
      if (event.key === 'Tab') {
        event.preventDefault();
        const start = editor.selectionStart;
        editor.setRangeText('    ', start, editor.selectionEnd, 'end');
      }
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') runCode();
    });
    loadFiles().catch(error => { status.textContent = error.message; });
  </script>
</body>
</html>

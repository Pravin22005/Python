<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Playground</title>
  <style>
    :root { color-scheme: light; --bg:#f4f7fb; --panel:#ffffff; --panel-2:#eef3f9; --border:#d9e1ec; --text:#172033; --muted:#66758a; --accent:#16865b; --blue:#2769b3 }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; overflow-x:hidden; background:#f6f8fb; color:var(--text); font:14px/1.5 system-ui,sans-serif }
    header { min-height:74px; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:12px 28px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.9); backdrop-filter:blur(14px) }
    h1 { margin:0; font-size:20px; letter-spacing:-.02em } h1 span { color:#ffd43b; margin-right:7px }
    .subtitle { color:var(--muted); font-size:12px; margin-top:2px }
    .actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:flex-end }
    button { height:38px; border:1px solid var(--border); border-radius:9px; background:var(--panel-2); color:var(--text); padding:0 14px; cursor:pointer; transition:.18s ease; font-weight:600 }
    button:hover { transform:translateY(-1px); border-color:#9bb0c9; background:#e4edf8 } button:disabled { opacity:.55; cursor:wait; transform:none }
    button.primary { background:#16865b; color:white; border-color:#16865b; box-shadow:0 6px 18px #16865b30 } button.primary:hover { background:#116f4b }
    main { display:grid; grid-template-columns:260px minmax(0,1fr); height:calc(100vh - 74px); min-height:560px }
    aside { border-right:1px solid var(--border); background:rgba(255,255,255,.82); overflow:auto; padding:10px 12px }
    aside h2 { margin:0; padding:14px 10px 8px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.1em }
    #files { list-style:none; margin:0; padding:6px }
    #files button { width:100%; height:auto; text-align:left; border:0; background:transparent; padding:10px; font-weight:500; color:#40516a }
    #files button.active { background:#dff4e9; color:#125b40; box-shadow:inset 3px 0 var(--accent) }
    .work { display:grid; grid-template-rows:minmax(300px,1fr) 230px; min-width:0; padding:18px; gap:14px }
    .editor-panel,.output-panel { overflow:hidden; border:1px solid var(--border); border-radius:13px; background:var(--panel); box-shadow:0 12px 40px #31527418 }
    .editor-head,.output-head { height:51px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding:0 16px; background:linear-gradient(90deg,#ffffff,#f0f5fb) }
    #filename,#status { color:var(--muted); font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    textarea { width:100%; height:calc(100% - 51px); resize:none; border:0; outline:0; padding:20px; background:#fbfcfe; color:#1b2a40; font:15px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; tab-size:4 }
    pre { margin:0; height:177px; overflow:auto; padding:16px 18px; white-space:pre-wrap; color:#24527f; background:#fbfcfe; font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace }
    @media (max-width:1100px) and (min-width:761px) { header { padding-inline:20px } .work { padding:14px; grid-template-rows:minmax(300px,1fr) 210px } }
    @media (max-width:760px) {
      header { padding:14px 16px; align-items:stretch; flex-direction:column; gap:12px }
      h1 { font-size:18px } .subtitle { max-width:42ch; line-height:1.35 }
      .actions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; justify-content:stretch }
      .actions button { width:100%; padding-inline:6px; font-size:12px }
      main { grid-template-columns:1fr; height:auto; min-height:0 }
      aside { border-right:0; border-bottom:1px solid var(--border); max-height:168px; padding:6px 10px }
      aside h2 { padding:8px 6px 4px }
      #files { display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px; scrollbar-width:thin }
      #files li { flex:0 0 auto } #files button { width:auto; white-space:nowrap; padding:8px 11px; border:1px solid var(--border); border-radius:8px }
      #files button.active { border-color:var(--accent) }
      .work { display:grid; grid-template-rows:minmax(390px,58vh) 220px; padding:10px; gap:10px; min-height:0 }
      .editor-head,.output-head { padding-inline:12px }
      textarea { padding:15px; font-size:13px; line-height:1.55 }
      pre { padding:13px 14px; font-size:12px; height:167px }
    }
    @media (max-width:420px) {
      .actions button { font-size:11px } .work { grid-template-rows:minmax(360px,55vh) 205px }
      #filename,#status { max-width:48%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    }
  </style>
</head>
<body>
  <header>
    <div><h1><span>&gt;_</span> Python Playground</h1><div class="subtitle">Edit, run, download, and submit Python safely through a pull request</div></div>
    <div class="actions">
      <button id="download">Download</button>
      <button id="save">Save as PR</button>
      <button id="run" class="primary">Run Python</button>
    </div>
  </header>
  <main>
    <aside><h2>Repository files</h2><ul id="files"></ul></aside>
    <section class="work">
      <div class="editor-panel">
        <div class="editor-head"><span id="filename">hello.py</span><span id="status">Loading...</span></div>
        <textarea id="editor" spellcheck="false" aria-label="Python code"></textarea>
      </div>
      <div class="output-panel">
        <div class="output-head"><strong>Output</strong><button id="clear">Clear</button></div>
        <pre id="output"></pre>
      </div>
    </section>
  </main>
  <script>
    const API = 'https://python-playground-api.onrender.com';
    const editor = document.querySelector('#editor');
    const output = document.querySelector('#output');
    const status = document.querySelector('#status');
    const filename = document.querySelector('#filename');
    const owner = 'pravin22kumar';
    const repo = 'Python';
    let activeFile = 'hello.py';

    async function loadFiles() {
      const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents`);
      if (!response.ok) throw new Error('Could not load repository files');
      const files = (await response.json()).filter(file => file.type === 'file' && file.name.endsWith('.py'));
      const list = document.querySelector('#files');
      list.innerHTML = '';
      for (const file of files) {
        const li = document.createElement('li');
        const button = document.createElement('button');
        button.textContent = file.name;
        button.dataset.name = file.name;
        button.onclick = () => openFile(file);
        li.appendChild(button);
        list.appendChild(li);
      }
      if (files.length) openFile(files[0]);
    }

    async function openFile(file) {
      document.querySelectorAll('#files button').forEach(button => button.classList.toggle('active', button.dataset.name === file.name));
      activeFile = file.name;
      filename.textContent = file.name;
      const response = await fetch(file.download_url);
      editor.value = response.ok ? await response.text() : '# Unable to load file';
    }

    async function runCode() {
      document.querySelector('#run').disabled = true;
      output.textContent = '';
      status.textContent = 'Running...';
      try {
        const response = await fetch(API + '/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: editor.value })
        });
        const result = await response.json();
        output.textContent = (result.stdout || '') + (result.stderr || '');
        status.textContent = response.ok ? (result.exit_code === 0 ? 'Completed successfully' : `Exited with code ${result.exit_code}`) : 'Request failed';
      } catch (error) {
        output.textContent = error.message;
        status.textContent = 'Request failed';
      } finally { document.querySelector('#run').disabled = false; }
    }

    async function savePullRequest() {
      status.textContent = 'Creating pull request...';
      try {
        const response = await fetch(API + '/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: activeFile, content: editor.value, title: `Update ${activeFile}` })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Could not create pull request');
        status.textContent = 'Pull request created';
        window.open(result.pull_request_url, '_blank', 'noopener');
      } catch (error) {
        status.textContent = 'Save failed';
        alert(error.message);
      }
    }

    document.querySelector('#run').onclick = runCode;
    document.querySelector('#save').onclick = savePullRequest;
    document.querySelector('#clear').onclick = () => output.textContent = '';
    document.querySelector('#download').onclick = () => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([editor.value], { type: 'text/x-python' }));
      link.download = activeFile;
      link.click();
      URL.revokeObjectURL(link.href);
    };
    editor.addEventListener('keydown', event => {
      if (event.key === 'Tab') {
        event.preventDefault();
        const start = editor.selectionStart;
        editor.setRangeText('    ', start, editor.selectionEnd, 'end');
      }
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') runCode();
    });
    loadFiles().catch(error => { status.textContent = error.message; });
  </script>
</body>
</html>
